name: Refresh PSX dashboard
on:
  schedule:
    - cron: '*/30 4-9 * * 1-5'   # every 30 min, 09:00-14:30 PKT, Mon-Fri
    - cron: '45 10 * * 1-5'      # 15:45 PKT daily report
  workflow_dispatch:             # the "Run workflow" button = refresh now
    inputs:
      test_notify:
        description: 'Also send a test phone + email notification'
        type: boolean
        default: false
      run_ai:
        description: 'Run the AI analyst now (it also runs automatically with the 15:45 daily report)'
        type: boolean
        default: false
      history_budget:
        description: 'How many months of price history to fetch this run (80 normal, 400 to catch up fast)'
        default: '80'
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Load private holdings
        env:
          HOLDINGS_CSV: ${{ secrets.HOLDINGS_CSV }}
          HOLDINGS_KEY: ${{ secrets.HOLDINGS_KEY }}
        run: python backend/vault.py load
      - name: Probe PSX feeds (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: python backend/probe.py
      - name: Notification channels (no secret values are printed)
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: python backend/notify.py --check
      - name: Build dashboard
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DASH_URL: ${{ vars.DASH_URL }}
          HISTORY_BUDGET: ${{ inputs.history_budget || '80' }}
        run: |
          ARGS=""
          if [ "${{ github.event.schedule }}" = "45 10 * * 1-5" ]; then ARGS="--daily"; fi
          if [ "${{ inputs.test_notify }}" = "true" ]; then ARGS="$ARGS --test-notify"; fi
          if [ "${{ inputs.run_ai }}" = "true" ]; then ARGS="$ARGS --ai"; fi
          python backend/main.py $ARGS
      - name: Publish
        run: |
          git config user.name "psx-bot"; git config user.email "psx-bot@users.noreply.github.com"
          git add docs
          if [ -f config/holdings.enc ]; then git add config/holdings.enc; fi
          if ! git diff --staged --quiet; then
            git commit -m "Refresh dashboard"
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && exit 0
              sleep 5
            done
            exit 1
          fi
